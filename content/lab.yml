# PUBLICATIONS: newest first; year must be a number. Keep id unique.
# Required: id, title, authors, year, venue, type, url.
# Optional: code (a repository URL). type is "Article" or "Preprint".
# Example:
#   - id: short-name-2027
#     title: "A title containing a colon: use quotation marks"
#     authors: Author One, Author Two
#     year: 2027
#     venue: Journal name
#     type: Article
#     url: https://doi.org/your-doi
publications:
  - id: diffusion-2026
    title: Gradient-Based Inverse Design of Free-Energy Landscapes with Diffusion Models
    authors: Eli Zick, Dan Mendels
    year: 2026
    venue: arXiv
    type: Preprint
    url: https://arxiv.org/abs/2607.06421
    code: https://github.com/MendelsResearchGroup/Gradient-Based-Free-Energy-Surface-Optimization
    overview:
      abstract: Free-energy surfaces govern the populations of metastable states and the barriers that
        control transitions between them, making their direct optimization a central challenge in
        molecular and materials design. In this work, we introduce Gradient-Based Free Energy
        Surface Optimization (GB-FESO), an inverse design framework that uses a trained conditional
        diffusion model as a differentiable surrogate for the ensemble distribution. After training,
        the diffusion model is frozen, and the conditioning variables defining the system are
        optimized so that the generated ensemble reproduces a prescribed target free-energy surface.
        The optimization is carried out by backpropagating a distribution-level loss, based on
        kernel density estimates of the Kullback–Leibler divergence, through a deterministic
        diffusion sampling trajectory. We first validate GB-FESO on one-dimensional Gaussian
        ensembles, demonstrating that both continuous and relaxed discrete conditioning variables
        can be optimized to recover target distributions, including those outside the training
        domain. We then apply the method to a four-particle Lennard–Jones toy peptide exhibiting
        multiple metastable conformational states. In this more physically motivated setting,
        GB-FESO successfully optimizes the interaction parameters to reproduce target free-energy
        landscapes in the majority of test cases, with optimization performed either in the full
        internal-coordinate space or in a reduced collective-variable representation. These results
        establish GB-FESO as a promising first step toward an ensemble-level inverse design
        framework for molecular systems with prescribed thermodynamic and kinetic behavior.
      abstract_source: https://arxiv.org/html/2607.06421v1
      abstract_version: arXiv preprint
      figure:
        image: /assets/papers/diffusion-2026.png
        number: Figure 1
        caption: "Figure 1: Schematic representation of the GB-FESO workflow. The diffusion model generates
          a large batch of samples with a given condition vector. The optimizer calculates the KL
          divergence loss between the generated and target ensembles and backpropagates gradients
          back to the condition through the entire sampler path."
        source: https://arxiv.org/html/2607.06421v1#S2.F1
        license: CC BY 4.0
        license_url: https://creativecommons.org/licenses/by/4.0/
        credit: © 2026 the authors. Reproduced without alteration from the arXiv preprint.
        width: 1482
        height: 718
        alt: "Figure 1: Schematic representation of the GB-FESO workflow. The diffusion model generates a
          large batch of samples with a given condition vector. The optimizer calculates the KL
          divergence loss between the generated and target ensembles and backpropagates gradients
          back to the condition through the entire sampler path."
    published: 2026-07-07
  - id: gnn-2026
    title: Enabling Structure-Only Initialization and Out-of-Distribution Generalization in GNN-Based
      Molecular Dynamics Simulators
    authors: Sergey A. Shteingolts, Salman N. Salman, Dan Mendels
    year: 2026
    venue: Journal of Chemical Theory and Computation
    type: Article
    url: https://doi.org/10.1021/acs.jctc.6c01145
    overview:
      abstract: Machine learning-based simulators offer the potential to model the dynamics of complex
        systems significantly more efficiently than classical approaches, while retaining
        differentiability, a key property for materials design and optimization. In recent years,
        graph neural network (GNN)-based simulators have shown strong performance across a range of
        physical domains, including molecular dynamics. However, their reliance on temporal context,
        i.e., sequences of previous states, for accurate prediction can limit their applicability in
        inverse design settings, where simulations must be initialized from a single structural
        configuration. Moreover, inverse design inherently requires robust out-of-distribution (OOD)
        generalization, as candidate structures typically lie outside the training domain. Here, we
        address both challenges by introducing two complementary strategies that enable stable and
        accurate structure-only initialization of GNN-based simulations for previously unseen
        systems. To explicitly target OOD generalization, we further propose an inference-time
        physics-based optimization framework that constrains model predictions to remain physically
        consistent during rollout. In addition, we introduce a differentiable, GNN-based barostat
        that enables accurate tracking of system dimensions and pressure, which is critical for
        capturing macroscopic responses and supporting generalization in extrapolative regimes. We
        evaluate these approaches in the context of uniaxial compression of two-dimensional
        disordered elastic networks spanning a broad range of geometries, Poisson ratios, and
        microscopic behaviors. We find that, in combination, these methods substantially improve
        rollout stability and enable reliable OOD generalization, including to regimes exhibiting
        qualitatively distinct and more complex dynamics than those represented in the training
        data. These results demonstrate that, when appropriately initialized and constrained,
        GNN-based simulators can serve as efficient and generalizable tools for materials discovery
        and structural optimization, marking a step toward their broader use in materials,
        molecular, and dynamical system design and engineering.
      abstract_source: https://arxiv.org/html/2605.09495v1
      abstract_version: arXiv preprint
      figure:
        image: /assets/papers/gnn-2026.png
        number: Figure 2
        caption: "Figure 2: Schematic overview of the two proposed approaches for addressing the SOI problem
          of GNN-based simulators. The first approach (top) employs a custom differentiable MD
          engine to generate initial dynamics, while the second approach (bottom) uses a cascade of
          specialized GNN simulators tailored to the initial timesteps."
        source: https://arxiv.org/html/2605.09495v1#S2.F2
        license: CC BY-NC-ND 4.0
        license_url: https://creativecommons.org/licenses/by-nc-nd/4.0/
        credit: © 2026 the authors. Reproduced without alteration from the arXiv preprint.
        width: 2100
        height: 999
        alt: "Figure 2: Schematic overview of the two proposed approaches for addressing the SOI problem of
          GNN-based simulators. The first approach (top) employs a custom differentiable MD engine
          to generate initial dynamics, while the second approach (bottom) uses a cascade of
          specialized GNN simulators tailored to the initial timesteps."
    published: 2026-10-27
    preprint: https://arxiv.org/abs/2605.09495
  - id: peptide-surface-2026
    title: Collective Variable-Guided Engineering of the Free-Energy Surface of a Small Peptide
    authors: Muralika Medaparambath, Alexander Zhilkin, Dan Mendels
    year: 2026
    venue: Journal of Chemical Information and Modeling
    type: Article
    url: https://pubs.acs.org/doi/10.1021/acs.jcim.6c00674
    code: https://github.com/MendelsResearchGroup/CV-guided-FES-engineering
    overview:
      abstract: Engineering the free-energy surfaces (FES) of proteins and peptides is central to
        controlling conformational ensembles and their responses to perturbations. However,
        predicting how chemical modifications such as point mutations reshape the FES and shift
        conformational equilibria remains challenging, particularly in data-scarce settings.
        Building on the Collective Variables for Free-Energy Surface Tailoring (CV-FEST) framework,
        we develop a computational approach that leverages short, unbiased molecular dynamics
        trajectories to guide mutation analysis. Using the ten-residue β-hairpin CLN025 and a
        systematic library of its single-point mutants, we apply Harmonic Linear Discriminant
        Analysis (HLDA) to extract collective variables from the conformational data. We find that
        the HLDA eigenvector learned solely from short wild-type trajectories provides residue-level
        insights into the propensity of mutations at specific positions to thermodynamically
        stabilize or destabilize the folded state. Extending this analysis, we show that shifts in
        the leading HLDA eigenvalue across mutants, a measure of changes in separability between the
        conformational ensembles along the HLDA coordinate, correlate strongly with mutation-induced
        changes in the free-energy difference between states, as reflected in melting temperatures.
        Benchmarked against Replica-Exchange Molecular Dynamics simulations, these findings suggest
        a promising and computationally affordable route toward guiding the engineering of
        biomolecular free-energy landscapes.
      abstract_source: https://pmc.ncbi.nlm.nih.gov/articles/PMC13418176/
      abstract_version: Published article
      figure:
        image: /assets/papers/peptide-surface-2026.jpg
        number: Figure 1
        caption: (a) Structural model of CLN025 with inter-residue distance descriptors (black lines). (b)
          Absolute HLDA eigenvector weights for each distance descriptor.
        source: https://pmc.ncbi.nlm.nih.gov/articles/PMC13418176/#fig1
        license: CC BY 4.0
        license_url: https://creativecommons.org/licenses/by/4.0/
        credit: © 2026 the authors. Published by the American Chemical Society. Reproduced without
          alteration.
        width: 627
        height: 378
        alt: (a) Structural model of CLN025 with inter-residue distance descriptors (black lines). (b)
          Absolute HLDA eigenvector weights for each distance descriptor.
    published: 2026-07-10
  - id: peptide-kinetics-2026
    title: Guiding Peptide Kinetics via Collective-Variable Tuning of Free-Energy Barriers
    authors: Alexander Zhilkin, Muralika Medaparambath, Dan Mendels
    year: 2026
    venue: Journal of Chemical Theory and Computation
    type: Article
    url: https://pubs.acs.org/doi/10.1021/acs.jctc.6c00418
    code: https://github.com/MendelsResearchGroup/guiding-peptide-kinetics
    overview:
      abstract: While recent advances in AI have transformed protein structure prediction, protein
        function is also strongly influenced by the thermodynamic and kinetic features encoded in
        its underlying free-energy surface. Here, we propose a framework to rationally reshape this
        landscape in order to control conformational transition rates, built on the Collective
        Variables for Free Energy Surface Tailoring (CV-FEST) framework, and validate it on point
        mutations of the miniprotein Chignolin. The framework relies on Harmonic Linear Discriminant
        Analysis (HLDA)-based collective variables (CVs) constructed from short molecular dynamics
        trajectories confined to metastable basins, requiring only limited sampling within each
        basin. Notably, the HLDA CV derived solely from the wild-type system already provides
        residue-level scores that predict whether mutations at specific positions are likely to
        accelerate or slow unfolding transitions. Furthermore, we find that the leading HLDA
        eigenvalue associated with the derived CV, a quantitative measure of the one-dimensional
        statistical separation between folded and unfolded ensembles, is significantly correlated
        with transition rates across mutations. Together, these results suggest that kinetic effects
        of point mutations can be inferred from minimal local sampling, providing a practical route
        for guiding the engineering of transition rates without exhaustive simulations or large
        training data sets.
      abstract_source: https://pmc.ncbi.nlm.nih.gov/articles/PMC13173532/
      abstract_version: Published article
      figure:
        image: /assets/papers/peptide-kinetics-2026.jpg
        number: Figure 1
        caption: (a) Illustration of representative backbone-distance descriptors used as input features for
          HLDA construction. (b) Aggregated per-residue HLDA weights derived from the leading
          eigenvector of the WT projection using eq 8, shown as normalized values.
        source: https://pmc.ncbi.nlm.nih.gov/articles/PMC13173532/#fig1
        license: CC BY 4.0
        license_url: https://creativecommons.org/licenses/by/4.0/
        credit: © 2026 the authors. Published by the American Chemical Society. Reproduced without
          alteration.
        width: 666
        height: 346
        alt: (a) Illustration of representative backbone-distance descriptors used as input features for
          HLDA construction. (b) Aggregated per-residue HLDA weights derived from the leading
          eigenvector of the WT projection using eq 8, shown as normalized values.
    published: 2026-04-20
  - id: networks-2025
    title: "Evaluating the use of a machine learning simulator for structure–property prediction: A case
      study on disordered elastic networks"
    authors: Salman N. Salman, Sergey A. Shteingolts, Ron Levie, Dan Mendels
    year: 2025
    venue: The Journal of Chemical Physics
    type: Article
    url: https://pubs.aip.org/aip/jcp/article/163/12/124115/3364390/
    overview:
      abstract: Machine learning models often require large datasets and struggle to generalize beyond
        their training distribution. These limitations pose significant challenges in scientific and
        engineering contexts, where generating exhaustive datasets is often impractical and the goal
        is to frequently discover novel solutions outside the training domain. In this work, we
        explore the use of dynamical data through a graph neural network-based simulator to enable
        efficient system-to-property learning and out-of-distribution prediction in the context of
        uniaxial compression of two-dimensional disordered elastic networks. We find that the
        simulator can learn the underlying physical dynamics from a small number of training
        examples and accurately reproduce the temporal evolution of unseen networks. Notably, the
        simulator is able to accurately predict emergent properties such as Poisson’s ratio and its
        dependence on strain, even though it was not explicitly trained for this task. In addition,
        it generalizes well across variations in system temperature, strain amplitude, and most
        significantly, Poisson’s ratios beyond the training range. These findings suggest that using
        dynamical data to train machine learning models can support more information efficient and
        generalizable approaches for materials and molecular design, especially in data-scarce
        settings.
      abstract_source: https://doi.org/10.1063/5.0282871
      abstract_version: Published article
      figure:
        image: /assets/papers/networks-2025.png
        number: Figure 1
        caption: "Left panel: illustration of a two-dimensional disordered elastic network with periodic
          boundary conditions, where the particles represent point masses and the edges correspond
          to harmonic bonds. Right panel: architecture of the simulator model used in this work. MPL
          denotes a message passing layer; layers are applied sequentially to the processor’s
          input."
        source: https://doi.org/10.1063/5.0282871
        license: CC BY-NC 4.0
        license_url: https://creativecommons.org/licenses/by-nc/4.0/
        credit: © 2025 the authors. Published by AIP Publishing. Reproduced without alteration.
        width: 1350
        height: 549
        alt: "Left panel: illustration of a two-dimensional disordered elastic network with periodic
          boundary conditions, where the particles represent point masses and the edges correspond
          to harmonic bonds. Right panel: architecture of the simulator model used in this work. MPL
          denotes a message passing layer; layers are applied sequentially to the processor’s
          input."
    published: 2025-09-24
    doi: 10.1063/5.0282871
