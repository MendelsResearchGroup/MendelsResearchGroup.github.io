lab:
  name: CME Lab
  full_name: Lab for Computational Molecular Engineering
  group: Mendels Research Group
  institution: Technion — Israel Institute of Technology
  department: Wolfson Department of Chemical Engineering
  location: Haifa, Israel
  email: danmendels@technion.ac.il
  site_url: https://mendelsresearchgroup.github.io
  github: https://github.com/MendelsResearchGroup
  original_site: https://mendelsgroup.net.technion.ac.il/
  logo: /assets/logo.png
  group_photo: /assets/lab-group.jpg
  group_photo_caption: The CME group at the Technion · 2024
  description: Computational molecular engineering at the Technion. The Mendels Research Group combines molecular simulation, physics, chemistry, and AI to understand and design molecules and materials.

home:
  eyebrow: Physics. Chemistry. Artificial intelligence.
  title: Understanding molecules. Designing possibility.
  introduction: >-
    We develop computational tools to understand how molecular systems work —
    and to design what they can do next.
  about_title: From molecular motion to material function.
  about: >-
    At the Technion, our group brings molecular dynamics and Monte Carlo simulations
    together with physics, chemistry, and artificial intelligence. We study the
    connections between structure, dynamics, and function, working with experimental
    and industrial partners to translate computational ideas into new technologies.

research:
  title: Designing at the molecular scale.
  introduction: >-
    How does molecular structure give rise to function? We develop and apply
    computational methods to explore this question, from proteins and polymers
    to structural materials and energy technologies.
  methods:
    - Molecular dynamics
    - Monte Carlo simulation
    - Enhanced sampling
    - Physics-informed machine learning
  areas:
    - id: molecular-design
      number: "01"
      title: Molecules & proteins
      subtitle: Dynamics that shape biological function
      description: >-
        Computational approaches to drug and protein design, including the
        free-energy landscapes and kinetic barriers that govern molecular behavior.
      topics: [Protein design, Peptide kinetics, Free-energy landscapes]
      publication_ids: [peptide-surface-2026, peptide-kinetics-2026]
    - id: materials
      number: "02"
      title: Materials & mechanics
      subtitle: Connecting microscopic structure to response
      description: >-
        Understanding and engineering smart structural materials and polymers,
        with studies of disordered elastic networks and structure–property prediction.
      topics: [Smart materials, Polymers, Elastic networks]
      publication_ids: [networks-2025, networks-2023]
    - id: energy
      number: "03"
      title: Energy & molecular systems
      subtitle: Computational tools for emerging technologies
      description: >-
        Applying molecular and materials engineering to next-generation solar cells
        and batteries, alongside methods for understanding phase behavior and solubility.
      topics: [Solar cells, Batteries, Phase behavior]
      publication_ids: [solubility-2022, phases-2018]

