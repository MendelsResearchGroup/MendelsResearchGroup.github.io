# PEOPLE: image is a file in public/assets/. Website and email are optional.
# To remove a member from the site, remove their complete block.
people:
  - id: dan-mendels
    name: Dr. Dan Mendels
    role: Principal Investigator
    image: /assets/dan.jpg
    email: danmendels@technion.ac.il
    bio: >-
      Dr. Dan Mendels is an assistant professor at the Wolfson Department of Chemical Engineering in
      the Technion, Israel. Prior to joining the Technion he was a postdoctoral scholar at the
      Pritzker school of Molecular Engineering at the University of Chicago where he focused on the
      engineering and design of smart materials. Prior to that he held a combined appointment as a
      postdoctoral scholar at USI and ETH Zurich, Switzerland, where he focused on the development
      of enhanced sampling methodologies. Dan holds a PhD in Electrical Engineering from the
      Technion and an MSc and BSc in Physics with honors from the Hebrew University of Jerusalem,
      Israel.
  - id: sergey-shteingoltz
    name: Sergey Shteingoltz
    role: PhD Student
    image: /assets/sergey.jpg
    bio: >-
      Sergey joined the CME in March 2023. He earned his BSc and MSc from Kazan Federal University,
      Butlerov's Chemistry Institute (2014-2019).
  - id: salman-salman
    name: Salman Salman
    role: PhD Student
    image: /assets/salman.jpeg
    bio: >-
      Salman joined the group in October 2023. He has a BSc and MSc with honors in Computer Science
      from Leipzig University and the University of Strathclyde, respectively. His primary focus was
      on machine learning, search-based optimization techniques and algorithms, with background in
      theoretical computer science. Salman's research interests include the intersection of deep and
      machine learning with physics and chemistry, scientific computing, and algorithmic information
      theory.
  - id: muralika-medaparambath
    name: Muralika Medaparambath
    role: MSc Student
    image: /assets/muralika.jpg
    bio: >-
      I’m a masters student in Applied Mathematics at the Technion. I'm interested in using
      computational and statistical methods to study protein folding and dynamics.
  - id: alex-zhilkin
    name: Alex Zhilkin
    role: PhD Student
    image: /assets/alex.jpg
    website: https://alex-zhilkin.github.io/
    bio: >-
      I’m a PhD student with an MSc in Theoretical and Computational Methods from the University of
      Helsinki, where I also worked as a research assistant in the Sum of Products group. During my
      master’s I focused on developing statistical and computational methods for machine learning,
      aimed at building more general tools for understanding and modeling data. Besides academia, I
      have about 10 years of experience as a software engineer, most recently leading the technical
      side of a game development project at Netflix. I like building things that combine deep
      computation with something people can actually use - from research simulations to interactive
      applications.
  - id: eli-zick
    name: Eli Zick
    role: PhD Student
    image: /assets/eli.png
    bio: >-
      Eli joined the CME Group in April 2025. He has an MSc in Physics from Ural Federal University
      where his primary focus was on quantum chemical calculations and DFT and their applications in
      the field of NMR.

# PUBLICATIONS: newest first; year must be a number. Keep id unique.
# Required: id, title, authors, year, venue, type, url.
# Optional: code (a repository URL). type is "Article" or "Preprint".
# Example:
#   - id: short-name-2027
#     title: "A title containing a colon: use quotation marks"
#     authors: Author One, Author Two
#     year: 2027
#     venue: Journal name
#     type: Article
#     url: https://doi.org/your-doi
publications:
  - id: diffusion-2026
    title: Gradient-Based Inverse Design of Free-Energy Landscapes with Diffusion Models
    authors: Eli Zick, Dan Mendels
    year: 2026
    venue: arXiv
    type: Preprint
    url: https://arxiv.org/abs/2607.06421
    code: https://github.com/MendelsResearchGroup/Gradient-Based-Free-Energy-Surface-Optimization
    summary:
      headline: Designing the landscape, not just a structure.
      question: Can we choose a target free-energy landscape and work backward to the system parameters
        that produce it?
      approach: >-
        GB-FESO uses a trained conditional diffusion model as a differentiable representation of an
        ensemble. The model is frozen while the system’s conditioning variables are optimized,
        comparing generated distributions with a target through a kernel-density-based loss.
      finding: >-
        Tests recovered target Gaussian distributions, including targets beyond the training domain.
        In a four-particle Lennard-Jones toy peptide, optimized interaction parameters reproduced
        target landscapes in most tested cases, using either internal coordinates or collective
        variables.
      significance: >-
        This is a proof of concept for ensemble-level inverse design. The demonstrations use
        simplified systems; applying the framework to larger molecular systems remains a next step.
      source: https://arxiv.org/abs/2607.06421
  - id: gnn-2026
    title: Enabling Structure-Only Initialization and Out-of-Distribution Generalization in GNN-based
      Molecular Dynamics Simulators
    authors: Sergey A. Shteingolts, Salman N. Salman, Dan Mendels
    year: 2026
    venue: arXiv
    type: Preprint
    url: https://arxiv.org/abs/2605.09495
    summary:
      headline: Starting a learned simulator from structure alone.
      question: How can a graph neural network simulate a new material from one static configuration,
        including structures outside its training distribution?
      approach: >-
        The study develops two complementary initialization strategies, physics-based optimization
        during inference, and a differentiable GNN barostat to track pressure and changing system
        dimensions.
      finding: >-
        On compressed disordered elastic networks, the combined methods improve simulation stability
        and generalization across geometries, Poisson ratios, and microscopic responses, including
        more complex dynamical regimes than those represented in training.
      significance: >-
        Structure-only initialization and physically constrained rollouts make learned simulators
        more useful for inverse design. The evidence here concerns elastic-network benchmarks rather
        than unrestricted molecular systems.
      source: https://arxiv.org/abs/2605.09495
  - id: peptide-surface-2026
    title: Collective Variable-Guided Engineering of the Free-Energy Surface of a Small Peptide
    authors: Muralika Medaparambath, Alexander Zhilkin, Dan Mendels
    year: 2026
    venue: Journal of Chemical Information and Modeling
    type: Article
    url: https://pubs.acs.org/doi/10.1021/acs.jcim.6c00674
    code: https://github.com/MendelsResearchGroup/CV-guided-FES-engineering
    summary:
      headline: Reading mutation effects from local molecular motion.
      question: Can short simulations help identify how a peptide mutation changes the balance between
        folded and unfolded states?
      approach: >-
        The work applies CV-FEST and harmonic linear discriminant analysis to short, unbiased
        simulations of the ten-residue peptide CLN025 and a library of single-point mutants.
        Predictions are compared with replica-exchange molecular dynamics benchmarks.
      finding: >-
        A collective variable learned from the wild type identifies positions sensitive to mutation.
        Changes in the leading HLDA eigenvalue across mutants correlate with shifts in melting
        temperature, connecting local fluctuations to thermodynamic stability.
      significance: >-
        The results support an economical way to guide peptide mutation studies when data are
        limited. The correlations provide guidance, with validation on a small peptide rather than a
        universal predictor of protein stability.
      source: https://pmc.ncbi.nlm.nih.gov/articles/PMC13418176/
  - id: peptide-kinetics-2026
    title: Guiding Peptide Kinetics via Collective-Variable Tuning of Free-Energy Barriers
    authors: Alexander Zhilkin, Muralika Medaparambath, Dan Mendels
    year: 2026
    venue: Journal of Chemical Theory and Computation
    type: Article
    url: https://pubs.acs.org/doi/10.1021/acs.jctc.6c00418
    code: https://github.com/MendelsResearchGroup/guiding-peptide-kinetics
    summary:
      headline: Small fluctuations, clues to rare transitions.
      question: Can motion within a peptide’s folded and unfolded states reveal which mutations change its
        unfolding rate?
      approach: >-
        Using Chignolin as a test system, the study constructs HLDA collective variables from short
        simulations confined to metastable basins. Wild-type residue weights and mutant-specific
        eigenvalues are compared with unfolding times estimated using short-time infrequent
        metadynamics.
      finding: >-
        Wild-type residue scores identify positions where mutations tend to alter unfolding
        kinetics. Across point mutants, the leading HLDA eigenvalue is significantly associated with
        transition times. Learning the collective variable does not require observing transitions.
      significance: >-
        Local sampling can guide the search for mutations that change kinetic behavior. The
        association is imperfect, and extension to larger peptides and proteins still needs to be
        demonstrated.
      source: https://pmc.ncbi.nlm.nih.gov/articles/PMC13173532/
  - id: networks-2025
    title: "Evaluating the use of a machine learning simulator for structure–property prediction: A case
      study on disordered elastic networks"
    authors: Salman N. Salman, Sergey A. Shteingolts, Ron Levie, Dan Mendels
    year: 2025
    venue: The Journal of Chemical Physics
    type: Article
    url: https://pubs.aip.org/aip/jcp/article/163/12/124115/3364390/
    summary:
      headline: Learning material properties through dynamics.
      question: Can a model trained to simulate motion predict material properties it was never explicitly
        taught?
      approach: >-
        A graph neural network learns the dynamics of two-dimensional disordered elastic networks
        under uniaxial compression from a small number of examples. Its rollouts are used to
        evaluate emergent mechanical behavior.
      finding: >-
        The simulator reproduces the evolution of unseen networks and predicts Poisson’s ratio and
        its strain dependence without direct property training. It also generalizes across
        temperatures, strain amplitudes, and Poisson ratios outside the training range.
      significance: >-
        Dynamical training can support more data-efficient structure–property prediction. The study
        establishes this behavior for elastic networks, motivating further work on materials and
        molecular design.
      source: https://doi.org/10.1063/5.0282871
  - id: networks-2023
